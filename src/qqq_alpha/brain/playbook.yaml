# =============================================================================
# PLAYBOOK — guidance, not law.
#
# The brain reads this as accumulated experience. It is explicitly allowed to
# trade against any entry here when the evidence justifies it, provided it
# records the override and its reasoning. Every override is reviewed in the
# weekly learning loop; overrides that keep working get promoted into rules,
# and rules that keep getting overridden get demoted or deleted.
#
# version is bumped by the learning loop, never by hand.
# =============================================================================
version: 8
updated: "2026-08-15"
notes: >
  Seed playbook plus live-evidence entries. 2026-08-06 (missed V-reversal, then
  a losing power-hour chase) is baked into CAPITULATION_REVERSAL,
  PERFECT_ENTRY_TRAP and LATE_COMPENSATION_CHASE. EXHAUSTED_EXTREME_ENTRY came
  from the second trade (2026-08-10) dying the same way mirrored. v5 adds
  TREND_DAY_CONTINUATION and the counter-rule after 2026-08-11: a clean trend
  day traded zero times because the extreme-entry caution was cited at the lows
  all day while every shallow failed bounce — the actual entry — went untaken.
  (v4 was the operator-approved lesson L002.) v7 adds QUOTA_IS_NOT_A_SIGNAL
  after the operator observed second trades that read as obligation rather
  than conviction (2026-08-13's -41.7% second entry). v8 widens the daily
  cap to three and restates that rule for it: on 2026-08-19 the cap was
  full at 10:29 because a losing trade had spent the second slot, so when
  the brain's own declared CALL level came in during the afternoon rally it
  was never woken to judge it.

mission: >
  Find asymmetric intraday setups on QQQ options where a realistic move in the
  underlying produces at least a 50% gain on the contract, with a defined
  invalidation point. Fewer, better trades. A day with no trade is a valid day.

# ---------------------------------------------------------------------------
# What a high-quality setup tends to look like. Treat as patterns to recognise,
# not boxes to tick.
# ---------------------------------------------------------------------------
setups:
  - id: OR_BREAK
    name: "Opening range break with participation"
    description: >
      Price breaks the 15-minute opening range with relative volume above ~1.8
      and holds the break on a retest. Best when leaders agree and flow confirms.
    typical_window: "09:45-11:00 ET"
    typical_hold_minutes: 20-60
    fails_when: "Break happens on thin volume, or price immediately re-enters the range."

  - id: VWAP_RECLAIM
    name: "VWAP reclaim after washout"
    description: >
      Price sells off away from VWAP, then reclaims it with momentum turning.
      Institutions defend VWAP; reclaims often run to the session high.
    typical_window: "10:00-14:30 ET"
    typical_hold_minutes: 25-90
    fails_when: "Reclaim is marginal (<0.05%) and volume is falling."

  - id: FLOW_FOLLOW
    name: "Follow aggressive institutional flow"
    description: >
      Repeated same-direction sweeps in near-dated QQQ contracts, total premium
      well above the session norm, while price is coiled near a level.
    typical_window: "any"
    typical_hold_minutes: 15-45
    fails_when: "Flow is a single large block that may be a hedge, not a bet."

  - id: TREND_PULLBACK
    name: "Pullback to EMA in an established trend"
    description: >
      In a trending regime, price pulls back to EMA9/EMA21 and resumes.
      Lower reward than a break, but higher hit rate.
    typical_window: "10:30-15:00 ET"
    typical_hold_minutes: 20-60
    fails_when: "The pullback breaks EMA50 or the trend regime has already flipped."

  - id: TREND_DAY_CONTINUATION
    name: "Failed bounce in an established trend day"
    description: >
      On a day where trend, momentum and flow agree, price spends most of its
      time NEAR the session extreme — that is what trending means. The entry is
      neither the fresh extreme (EXHAUSTED_EXTREME_ENTRY) nor nothing
      (PERFECT_ENTRY_TRAP): it is the failed counter-move — the weak bounce
      toward VWAP/EMA9-21 that stalls and rolls back over. Enter with the trend
      as the bounce fails, stop above the bounce high. Evidence 2026-08-11: a
      clean TRENDING_DOWN session, 20+ declined PUT setups later priced at +51%
      to +109%, zero trades — every wake either refused the extreme or waited
      for a retest it had already watched come and go (the 14:0x bounce to
      ~721.8 WAS the retest, and it passed on that too).
    typical_window: "10:00-15:00 ET"
    typical_hold_minutes: 20-60
    fails_when: >
      The "bounce" reclaims VWAP with expanding volume — that is a reversal,
      not a pullback; stand down or flip.

  - id: CAPITULATION_REVERSAL
    name: "V-reversal after an opening flush"
    description: >
      A sharp opening sell-off on extreme volume that immediately V-recovers,
      reclaims VWAP, and flips the short timeframes bullish. On these days the
      pullback you are waiting for tends never to come — the shallow higher-low
      IS the pullback. Enter on the first 1m/5m higher-low above VWAP, not on a
      deep retest that trend days rarely offer.
    typical_window: "09:35-11:00 ET"
    typical_hold_minutes: 20-90
    fails_when: >
      The recovery stalls below VWAP, or the bounce is on fading volume and
      price re-enters the flush range.

  - id: TESTED_FLOOR_RECLAIM
    name: "Held floor, bounce, retest that holds"
    description: >
      A floor (or ceiling, mirrored) that has already held two or more times —
      today or across the week's levels — takes another hit, bounces with real
      volume, and then price comes BACK to it and the retest holds: smaller
      range, smaller volume, buyers absorbing. That second touch is the entry,
      CALL off the floor / PUT off the ceiling, with invalidation just beyond
      the level — one of the smallest honest invalidations any setup offers.
      The operator named this pattern directly, and 2026-08-27 is the evidence
      by absence: the 715.00 double bottom bounced on 392k volume, reclaimed
      VWAP, retested shallow and ran +6 points to the session high — while the
      engine was short from the flush low. The bounce alone is NOT the entry
      (that is knife-catching); the held retest is.
    typical_window: "09:45-15:00 ET"
    typical_hold_minutes: 20-60
    fails_when: >
      The retest arrives on EXPANDING volume with full-bodied candles — that is
      not a test, that is the level being run; or the bounce never reclaimed
      VWAP, leaving the "floor" just a pause inside a markdown.

  - id: GAP_AND_GO
    name: "Unfilled opening gap, with the gap"
    description: >
      The session opens with a gap of roughly 0.4% or more, the gap does NOT
      fill, and price holds above the open — that combination is a trend-day
      signature whatever the computed regime label says, because the regime
      classifier sees intraday bars while the gap IS the day's dominant fact.
      The entry is with the gap: the morning shakeout that fails to reach the
      fill level and V-reclaims the open/VWAP is the classic trigger, and a
      later flag near the highs is the second chance. Positions against an
      unfilled holding gap need exceptional, stated evidence — not a regime
      label, not an intraday shelf break.
    typical_window: "09:45-14:30 ET"
    typical_hold_minutes: 25-90
    fails_when: >
      The gap actually fills (price trades back through yesterday's close) —
      after a fill the signature is void and often reverses; or the gap is an
      exhaustion gap straight into a week-tested edge with rejection prints.

# ---------------------------------------------------------------------------
# Conditions that historically degrade edge. These lower confidence — they do
# not forbid a trade.
# ---------------------------------------------------------------------------
caution:
  - id: OPENING_WINDOW_ENTRY
    condition: "ENTER before 09:45 ET (the first 15 minutes of the session)"
    note: >
      Two of this engine's three losses were entries at minute 6 and minute 10
      of the session, both against or without the leaders. The opening window
      is where whipsaw hits stops hardest and where indicator readings are
      least trustworthy. An entry here needs the leaders aligned with the
      direction (leader_alignment >= 0) on top of the usual evidence; if you
      enter anyway, name this caution in overrides and say what makes this
      open different. The engine also halves recommended size before 10:30 —
      expect that and plan the trade at reduced size.
  - id: LUNCH_CHOP
    condition: "11:45-13:15 ET with relative volume below 1.0"
    note: "Liquidity thins, ranges compress, 0DTE theta keeps burning."
  - id: UNFILLED_GAP_FADE
    condition: >
      Entering AGAINST an opening gap of ~0.4%+ that has not filled and is
      holding above (below, for a gap down) its open
    note: >
      An unfilled holding gap is the single strongest day-type signal there
      is, and it outranks the regime label. Evidence 2026-08-27, the morning
      after NVDA earnings gapped QQQ +0.87%: two PUTs were taken against the
      unfilled gap — one at the very low of the opening flush minutes before
      the V-reclaim (-43%), one on a mid-shelf breakdown "consistent with
      range-day logic" while the risk list itself wrote that fading an
      unfilled gap is a trend-day signature (-38%). The breaker then locked
      the session and the day closed on its high. Both theses were coherent;
      both were fighting the day's dominant fact. Against an unfilled holding
      gap: no counter-gap entry without exceptional, named evidence — and a
      GAP_AND_GO entry in the gap's direction is the setup to hunt instead.
  - id: PRE_EVENT
    condition: "Within 20 minutes of a scheduled macro release (CPI, PPI, FOMC, NFP)"
    note: "Implied volatility is inflated; a correct direction can still lose on the crush."
  - id: WIDE_SPREAD
    condition: "Contract bid-ask spread above 8% of mid"
    note: "You pay the spread twice; a 50% target becomes a 66% target in practice."
  - id: LATE_DAY_0DTE
    condition: "After 15:00 ET on same-day expiry"
    note: "Gamma cuts both ways violently; only take these with a clear catalyst."
  - id: CONFLICTING_SIGNALS
    condition: "Trend and flow point in opposite directions"
    note: "Usually means a fight; wait for one side to lose."
  - id: PERFECT_ENTRY_TRAP
    condition: >
      You have said WAIT or PASS on 3+ consecutive wakes in the same direction
      while price kept trending, each time citing "extended above VWAP" or
      "waiting for a pullback/confirmation"
    note: >
      This is the signature of a trend day being missed one perfect-entry demand
      at a time. Evidence 2026-08-06: 15 consecutive WAIT/PASS during a V-reversal
      rally; 27 declined setups later priced at +50% to +254% while the one trade
      actually taken lost. On a trend day the shallow higher-low is the pullback —
      re-read CAPITULATION_REVERSAL and judge the trend itself, not the distance
      from VWAP.
  - id: LATE_COMPENSATION_CHASE
    condition: "First ENTER of the day comes after 15:00 ET following a day of WAIT/PASS decisions"
    note: >
      Entering late to make up for a missed day is compensation, not analysis.
      Evidence 2026-08-06: the only trade of the day was a 15:08 ET 0DTE chase
      against the LATE_DAY_0DTE caution — stopped out in 6 minutes at -47.7%.
      If the day was missed, missing it is the cheaper outcome; a 1DTE entry or
      no entry both beat a power-hour 0DTE chase.
  - id: EXHAUSTED_EXTREME_ENTRY
    condition: >
      The confirmation you waited for arrives only when price is AT the session
      extreme, RSI(15m) is beyond 25/75, and/or institutional flow is leaning
      the other way
    note: >
      Late confirmation at an extreme is not confirmation — it is the crowd's
      last push before the turn. Both real trades so far died exactly this way,
      each stopped within 7 minutes at ~-47%: 2026-08-06 bought the power-hour
      top after refusing entries all day; 2026-08-10 sold the opening-flush low
      at RSI(15m) 24, three minutes after writing that institutional CALL sweeps
      (+2.85M net) were hunting that very bottom. If the setup is real, the
      retest after the extreme offers a better fill — demand the retest, or
      trade the reversal the flow is voting for instead of fighting it.
      THE COUNTER-RULE, from 2026-08-11: this caution is about WHERE you enter,
      never WHETHER. On a trend day the retest is shallow and comes to you as a
      failed bounce (see TREND_DAY_CONTINUATION) — if you cite this caution on
      3+ consecutive wakes while trend and flow stay aligned, you are no longer
      avoiding the extreme, you are avoiding the trade: take the next failed
      bounce with the trend. The counter-rule demands the STRUCTURE (a real
      failed bounce with trend and flow still aligned), never an entry on the
      clock — see QUOTA_IS_NOT_A_SIGNAL.
      THE COUNTER-RULE'S OWN GATE, from 2026-08-26: "trend and flow aligned"
      is a precondition, not a decoration. In a chop/ranging regime, or
      mid-range of the week's tested levels, or with flow admittedly mixed,
      the counter-rule NEVER applies — waiting an Nth time there is still the
      correct answer, and the wake-count is not evidence of anything. The
      failure it must prevent recurring: a 4th-wake PUT forced by citing this
      counter-rule alone, bought at RSI(1m) 23 on the floor of a week-tested
      range in VOLATILE_CHOP, 0.15% from its own target, while the same
      thesis's risk list admitted the caution's condition was present — the
      floor held, the trade died on the bounce. If the caution's condition is
      admittedly TRUE and the day is not an aligned trend, the count argues
      for nothing.
  - id: QUOTA_IS_NOT_A_SIGNAL
    condition: >
      Considering an ENTER whose honest main driver is that trade slots remain
      for the day — any entry after the first, and most of all the last slot
    note: >
      The daily cap is a ceiling, not a quota, and an unused slot is not a
      missed opportunity. Evidence 2026-08-13: after the day's first trade
      banked +65%, the second entry leaned on counter-rule pressure without a
      fresh failed-bounce structure and lost -41.7%. The counter-rules in
      PERFECT_ENTRY_TRAP and EXHAUSTED_EXTREME_ENTRY exist to stop
      perfect-entry paralysis DURING an aligned trend — they never mean "you
      owe the day a trade", and they reset once a trade has been taken: after
      any completed trade, every further entry must qualify from zero on its
      own evidence, exactly as if it were the first of the day. A one-trade
      day — or ending the day flat after a win or a loss — is a fully
      professional outcome. The cap was widened in 2026-08 so that a genuine
      third setup is not turned away by arithmetic; that is a wider door, not
      a longer to-do list, and the honest test is unchanged: would you take
      this trade if it were the only one you were allowed all week?

# ---------------------------------------------------------------------------
# Contract selection preferences.
# ---------------------------------------------------------------------------
contract_selection:
  preferred_dte: [0, 1]
  preferred_delta_range: [0.30, 0.50]
  note: >
    Delta near 0.35-0.45 usually gives the best balance: enough leverage for a
    50%+ move on a modest underlying push, without the total-loss profile of
    far out-of-the-money lottery tickets. Deep OTM is allowed when flow is
    exceptional and the move is expected to be fast.
  min_open_interest: 200
  min_volume: 50

# ---------------------------------------------------------------------------
# Exit management.
# ---------------------------------------------------------------------------
exits:
  first_target_return_pct: 50
  first_target_take_pct: 50
  second_target_return_pct: 100
  runner_policy: >
    After the second target, trail the remainder rather than setting a fixed
    exit. The outsized results (200%+) come entirely from runners; capping them
    destroys the strategy's expectancy.
  stop_loss_return_pct: -40
  time_stop: >
    If the thesis has not started working within the expected hold window, the
    setup is stale. Exit and preserve capital for the next one.

