[project]
name = "qqq-alpha"
version = "0.1.0"
description = "AI-driven 0DTE options research engine for QQQ"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "websockets>=12.0,<16.0",
    "python-dotenv>=1.0,<2.0",
    "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.6,<1.0"]

[project.scripts]
qqq = "qqq_alpha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqq_alpha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
