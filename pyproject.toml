[project]
name = "qqq-alpha"
version = "0.1.0"
description = "AI-driven 0DTE options research engine for QQQ"
requires-python = ">=3.12"
# Deliberately small. Indicators are pure Python and memory is SQLite from the
# standard library, so pandas, numpy and duckdb are not needed — carrying them
# would triple the image and give a constrained build host a reason to fail.
dependencies = [
    "anthropic>=0.40,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
    "websockets>=12.0,<16.0",
    # the admin dashboard: a small read-only web view over the same journal
    # and memory the engine already writes, not a second source of truth
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "ruff>=0.6,<1.0"]

[project.scripts]
qqq = "qqq_alpha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqq_alpha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
